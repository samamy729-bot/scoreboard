<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cursed+Timer+ULiL&family=Inter:wght@700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scoreboard</title>
</head>
<body>
    <div class="container">
        <div class="team">
            <h3 class="team-label">HOME</h3>
            <div class="score-box">
                <span id="home-score" class="score">12</span>
            </div>
            <div class="controls">
                <button class="btn" onclick="addHome(1)">+1</button>
                <button class="btn" onclick="addHome(2)">+2</button>
                <button class="btn" onclick="addHome(3)">+3</button>
            </div>
        </div>
        <div class="team">
            <h3 class="team-label">GUEST</h3>
            <div class="score-box">
                <span id="guest-score" class="score">5</span>
            </div>
            <div class="controls">
                <button class="btn" onclick="addGuest(1)">+1</button>
                <button class="btn" onclick="addGuest(2)">+2</button>
                <button class="btn" onclick="addGuest(3)">+3</button>
            </div>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
